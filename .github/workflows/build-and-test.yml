name: Build and test

# Runs every runtime test; any failure fails the build (no baseline, ADR 0018 / zero-failure). Offline checks
# only: this workflow has no AWS credentials and never deploys anything.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-tests:
    name: runtime-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Python test environments (production package versions)
        run: npm run setup:python
      - run: npm run test:runtime

  # Phase 8: strict TypeScript over the contract declarations (types/), the checks that the runtime still matches them,
  # and the prompt tooling. No .ts source ships in a Lambda zip.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
