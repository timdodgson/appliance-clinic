name: Build images

# The error-code service's build equivalence. Phase 3 (#29) rebuilt the error-code MCP container image and proved it
# equal to the deployed image; since ADR 0022 (change 22.2) the service runs as the Zip Lambda
# applianceclinic-error-code-mcp, so this job rebuilds that zip (arm64 wheels from the hashed lock) and proves it equal
# to the deployed artefact (build/reference/applianceclinic-error-code-mcp.zip.json). The job keeps its name, `images`,
# because it is a required check. The retired image's reference stays in build/reference/ as the record. No AWS
# credentials; nothing is pushed or deployed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  images:
    name: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Error-code MCP zip
        run: |
          bash build/scripts/fetch_error_code_mcp_site.sh build/out/error-code-mcp-site
          python3 build/scripts/package_zips.py --out-dir build/out --mcp-site build/out/error-code-mcp-site
          python3 build/scripts/compare_zip.py build/reference/applianceclinic-error-code-mcp.zip.json build/out/applianceclinic-error-code-mcp.zip
