name: Web front end

# apps/web: lint, typecheck, unit/DOM tests and a reproducible build of the static site (customer chat, admin,
# static pages). No AWS credentials; deploying is a separate, manual step (apps/web/README.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build is reproducible
        run: cp dist.manifest.json /tmp/first.json && npm run build && cmp /tmp/first.json dist.manifest.json
