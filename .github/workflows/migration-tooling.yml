name: Migration tooling

# Offline checks only. This workflow has no AWS credentials and never deploys anything.
on:
  pull_request:
    paths:
      - 'tools/migration/**'
      - '.github/workflows/migration-tooling.yml'
  push:
    branches: [main]
    paths:
      - 'tools/migration/**'
      - '.github/workflows/migration-tooling.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/migration/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
