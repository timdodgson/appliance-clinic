name: Migration tooling

# Offline checks only. This workflow has no AWS credentials and never deploys anything.
# It runs on every pull request so that `migration-tooling` can be a required status check
# on main without blocking pull requests that do not touch the tooling.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: migration-tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/migration/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
